name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Any failing check stops the job, so nothing broken is deployed (Design document 13.1).
      - name: Validate content
        run: bundle exec ruby scripts/validate.rb
      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Validate feeds
        run: bundle exec ruby scripts/validate.rb --feeds
      - name: Check links
        run: bundle exec htmlproofer ./_site --disable-external
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  mirror:
    # Pushes main and tags to Codeberg (Design document 7.3). Never blocks the deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "::warning::CODEBERG_TOKEN is not set; skipping the mirror (BLG-05)."
            exit 0
          fi
          remote="https://Strinix:${CODEBERG_TOKEN}@codeberg.org/Strinix/blog.git"
          git push --force "$remote" HEAD:main
          git push --force --tags "$remote"
