<!doctype html>
{%- comment -%}
  Placeholder so posts build without warnings (BLG-10).
  Replaced by the base layout in BLG-13 and the post layout in BLG-21.
{%- endcomment %}
<html lang="{{ page.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
</head>
<body>
<main>
<h1>{{ page.title }}</h1>
<p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time> · {{ page.tags | join: ", " }}</p>
{{ content }}
</main>
</body>
</html>
