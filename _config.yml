# Site constants (Design document 1.1, JSON contracts 5).
# Layouts, plugins and scripts read settings only from here.

# Everything that becomes the website lives in src/; the repository root keeps
# only tooling (workflow, schemas, scripts, Gemfile) and docs.
source: src

title: "~/strinix"
url: "https://strinix.com.ar"
baseurl: ""
author:
  name: "Juan Martín Hernández"
email: "contact@strinix.com.ar"
languages: ["en", "es"]
default_lang: "en"
timezone: "America/Argentina/Buenos_Aires"
future: false

words_per_minute: 200
home_cards: 6
more_on_count: 3
feed_limit: 20

forges:
  github:   { user: "Juanma-Her", repo: "blog", branch: "main" }
  codeberg: { user: "Strinix",    repo: "blog", branch: "main" }

giscus:
  repo: "Juanma-Her/blog"
  repo_id: "R_kgDOV25wcA"
  category: "Comments"
  category_id: "DIC_kwDOV25wcM4DLrmY"
  mapping: "specific"      # data-term is post:<ref>, shared by both languages

licence:
  code: "GPL-3.0-or-later"
  content: "CC BY-SA 4.0"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: katex
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "_posts/en" }
    values: { lang: "en", layout: "post", permalink: "/posts/:title/" }
  - scope: { path: "_posts/es" }
    values: { lang: "es", layout: "post", permalink: "/es/posts/:title/" }
  - scope: { path: "pages/es" }
    values: { lang: "es" }
  - scope: { path: "" }
    values:
      lang: "en"
      # Link preview image (og:image) for every page.
      image: { path: "/assets/img/social.png", width: 1200, height: 630 }
